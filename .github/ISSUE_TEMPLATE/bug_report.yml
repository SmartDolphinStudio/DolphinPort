name: Bug report
description: Report a problem to help improve DolphinPort
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of steps that reproduces the problem.
      placeholder: |
        1. Open '...'
        2. Tap '...'
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      description: For example, "Pixel 6, Android 14".
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: DolphinPort version
      description: The version shown in the application or the release tag.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Logs, screenshots or anything else relevant.
    validations:
      required: false
