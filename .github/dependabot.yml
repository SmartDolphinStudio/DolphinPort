version: 2
updates:
  # Dart and Flutter packages.
  - package-ecosystem: "pub"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "dart"

  # Rust crates for the native core.
  - package-ecosystem: "cargo"
    directory: "/rust"
    target-branch: "master"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"

  # GitHub Actions used by the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
