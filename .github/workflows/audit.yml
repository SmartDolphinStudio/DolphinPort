name: Audit CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.97.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.6'
          channel: stable
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: rustup target add aarch64-linux-android
      - name: Install published Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze && flutter test
      - run: cd rust && cargo fmt --all -- --check && cargo test --locked && cargo clippy --all-targets --locked -- -D warnings
      - run: flutter build apk --debug --target-platform android-arm64
      - run: unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep 'lib/arm64-v8a/libdolphinport_core.so'
