import java.io.FileInputStream
import java.util.Properties

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing is read from `key.properties`, which is kept outside
// version control. Release tasks fail when valid signing materials are absent.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "astraeus.smartdolphin.dolphinport"
    compileSdk = 37
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "astraeus.smartdolphin.dolphinport"
        minSdk = 24
        targetSdk = 37
        versionCode = 1010016
        versionName = "1.0.16"
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

// Compile the actual Rust core before every Android package build.
def nativeOutput = file('src/main/jniLibs/arm64-v8a/libdolphinport_core.so')
def buildNativeCore = tasks.register('buildNativeCore', Exec) {
    workingDir rootProject.file('../rust')
    inputs.files(fileTree(rootProject.file('../rust/core/src')), rootProject.file('../rust/Cargo.lock'), rootProject.file('../rust/core/Cargo.toml'))
    outputs.file nativeOutput
    environment 'ANDROID_NDK_HOME', "${android.sdkDirectory}/ndk/${android.ndkVersion}"
    commandLine 'cargo', 'ndk', '-t', 'arm64-v8a', '-o', '../android/app/src/main/jniLibs', 'build', '--release', '--locked', '-p', 'dolphinport-core'
    doFirst {
        def version = providers.exec { commandLine 'cargo', 'ndk', '--version' }.standardOutput.asText.get()
        if (version.trim() != 'cargo-ndk 4.1.2') throw new GradleException('Install cargo-ndk 4.1.2 --locked')
    }
}
tasks.named('preBuild').configure { dependsOn buildNativeCore }
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }) {
        if (!hasReleaseKeystore || ['storeFile','storePassword','keyAlias','keyPassword'].any { !keystoreProperties[it] } || !rootProject.file(keystoreProperties['storeFile']).exists()) {
            throw new GradleException('Release signing materials are required; configure android/key.properties')
        }
    }
}
