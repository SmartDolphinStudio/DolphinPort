name: dolphinport
description: "DolphinPort — an Android-only digital wallet front-end, built for learning and demonstration."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

# The version and build number for the application.
# Android: build-name becomes versionName and build-number becomes versionCode.
version: 1.0.16+1010016

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  ffi: ^2.1.4
  fl_chart: ^1.2.0
  flutter_svg: ^2.0.9
  local_auth: ^3.0.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/anim/card_loader/
