[package]
name = "dolphinport-core"
version = "0.1.0"
edition = "2021"
description = "Native core bundled into the DolphinPort Android client."
license = "MIT"
publish = false

[lib]
name = "dolphinport_core"
# cdylib: the Android shared object (libdolphinport_core.so).
# rlib:   used by the host tools and tests in the workspace.
# staticlib: available for any future fully static embedding.
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "bundled" compiles a known SQLite amalgamation from source, so the Android
# build needs no system SQLite and behaves identically across API levels.
rusqlite = { version = "0.32", features = ["bundled"] }
